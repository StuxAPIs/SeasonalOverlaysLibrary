name: Deploy Pages

# GitHub's legacy branch-deploy Pages build (the default before this workflow
# existed) relies on an internal push-triggered hook with no API/log
# visibility, and it intermittently stopped auto-triggering for this repo
# with no error recorded anywhere. Deploying via Actions instead makes it an
# ordinary, observable CI job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
