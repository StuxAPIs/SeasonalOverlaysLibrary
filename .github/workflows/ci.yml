name: CI

# Runs the checks on pushes to main and test, and on every pull request (a pull request from test into
# main needs this to pass before it is merged).
on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tests/pages.js
      - run: bash tests/version.sh
